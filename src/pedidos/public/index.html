<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Formulário de Pedidos · Neo VoIP</title>
<link rel="icon" type="image/png" href="/formulario/assets/marca/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap">
<link rel="stylesheet" href="/formulario/assets/form.css">
</head>
<body>
<header class="topo">
  <div class="topo-in">
    <a class="logo" href="/formulario/" aria-label="Neo VoIP">
      <img src="/formulario/assets/marca/simbolo-branco.png" alt="" width="63" height="34">
      <span class="logo-texto"><span class="logo-nome">NEO<b>VOIP</b></span><span class="logo-sub">TELECOM CLOUD</span></span>
    </a>
    <h1>Formulário de Pedidos</h1>
  </div>
</header>
<main class="wrap">
  <ol class="passos" id="passos" aria-label="Etapas do pedido"></ol>
  <div class="grade">
    <form id="form" novalidate autocomplete="off">
      <section id="etapa" aria-live="polite"></section>
      <div class="nav-botoes">
        <button type="button" class="sec" id="voltar">Voltar</button>
        <button type="button" class="pri" id="avancar">Próximo</button>
      </div>
    </form>
    <aside class="painel" id="painel" aria-label="Resumo de valores"></aside>
  </div>
</main>
<script type="module" src="/formulario/assets/form.js"></script>
</body>
</html>

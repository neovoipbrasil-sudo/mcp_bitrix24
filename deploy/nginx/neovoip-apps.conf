# Sites dos apps — arquivo SEPARADO do 3CX. Não editar os arquivos do 3CX.
# Instalar em /etc/nginx/conf.d/neovoip-apps.conf (ou onde o 'nginx -T' mostrar que há include).
# Fase 1 (antes do certificado): deixe só o bloco "listen 80".
# Fase 2: depois do certbot, descomente os blocos "listen 443".

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    listen [::]:80;
    server_name connecmob.connectelecom.com.br proposal-assistant.connectelecom.com.br;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}


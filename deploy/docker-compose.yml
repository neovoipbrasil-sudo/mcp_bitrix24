# Apps da Neo VoIP rodando ao lado do 3CX, na mesma VPS.
# Regras de convivência com o 3CX:
#  - todas as portas ficam SOMENTE em 127.0.0.1 (nada novo exposto na internet);
#  - o acesso público passa pelo nginx que já existe (arquivo separado em nginx/);
#  - cada container tem limite de memória/CPU para nunca disputar recurso com a telefonia.
#
# Estrutura esperada na VPS:
#   /opt/neovoip/appquilometragem
#   /opt/neovoip/proposal-assistant
#   /opt/neovoip/mcp_bitrix24/deploy   <- este diretório (rodar o compose daqui)

name: neovoip

x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  quilometragem:
    <<: *defaults
    build:
      context: ../../appquilometragem
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${QUILOMETRAGEM_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${QUILOMETRAGEM_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_APP_URL: ${QUILOMETRAGEM_APP_URL}
    env_file: env/quilometragem.env
    ports: ["127.0.0.1:3001:3000"]
    mem_limit: 1g
    cpus: 1.5
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  propostas:
    <<: *defaults
    build:
      context: ../../proposal-assistant
    env_file: env/propostas.env
    ports: ["127.0.0.1:3002:3000"]
    mem_limit: 2g          # LibreOffice (geração de PDF) usa bastante memória
    cpus: 2
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  bot:
    <<: *defaults
    build:
      context: ..
    env_file:
      - path: env/bot.env
        required: false   # o bot entra numa etapa posterior
    ports: ["127.0.0.1:3300:3300"]
    volumes:
      - ./volumes/bot-data:/app/src/bot/data   # usuários do /reports, vínculos MSN Talk, auditoria
    mem_limit: 2g
    cpus: 1.5
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3300/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  uptime-kuma:
    <<: *defaults
    image: louislam/uptime-kuma:1.23.16
    ports: ["127.0.0.1:3010:3001"]
    volumes:
      - ./volumes/uptime-kuma:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"   # para monitorar o 3CX (SIP 5060/5061) no próprio host
    mem_limit: 512m
    cpus: 0.5
